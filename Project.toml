name = "FemtoChat"
uuid = "e5abf5ee-30ff-476c-be51-c704643a2f2a"
version = "0.1.0"

[deps]
CUDA = "052768ef-5323-5732-b1bb-66c8b64840ba"
DBInterface = "a10d1c49-ce27-4219-8d33-6db1a4562965"
Downloads = "f43a241f-c20a-4ad4-852c-f6b1247861c6"
DuckDB = "d2f5444f-75bc-4fdf-ac35-56f514c445e1"
Enzyme = "7da242da-08ed-463a-9acd-ee780be4f1d9"
LinearAlgebra = "37e2e46d-f89d-539d-b4ee-838fcccc9c8e"
Printf = "de0858da-6303-5e67-8744-51eddeeeb8d7"
Random = "9a3f8284-a2c9-5f02-9a11-845980a1fd5c"
Reactant = "3c362404-f566-11ee-1572-e11a4b42c853"
Serialization = "9e88b42a-f829-5b0c-bbe9-9e923198166b"
Tables = "bd369af6-aec1-5ad0-b16a-f7cc5008161c"

[weakdeps]
Mooncake = "da2b9cff-9c12-43a0-ae48-6db2b0edb7d6"
# Optional when FemtoChat is used by the legacy CUDA environment.
Reactant = "3c362404-f566-11ee-1572-e11a4b42c853"

# Install Reactant for the root REPL without requiring it in environments/dell.
[workspace]
projects = ["environments/reactant"]

# Map the extension UUID so its package-specific preference can be set.
[extras]
ReactantCUDAExt = "91356394-6239-50cb-9e6b-6f1f3f798cde"

[extensions]
FemtoChatCUDAExt = "CUDA"
FemtoChatEnzymeExt = "Enzyme"
FemtoChatMooncakeExt = ["CUDA", "Mooncake"]
FemtoChatReactantExt = ["CUDA", "Enzyme", "Reactant"]

[compat]
CUDA = "5.8, 6"
DBInterface = "2"
DuckDB = "1.5"
Enzyme = "0.13"
Mooncake = "0.5"
Reactant = "=0.2.285"
Tables = "1"
julia = "1.12"
